<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AgriBot CDPR Control</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e24; --accent: #00ff88; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 10px; user-select: none; touch-action: none; }
        .panel { background: var(--panel); border-radius: 12px; padding: 15px; margin: 10px auto; max-width: 450px; }
        
        /* Motor Buttons */
        .motor-row { display: flex; justify-content: space-between; align-items: center; background: #2c2c34; padding: 8px; margin-bottom: 5px; border-radius: 6px; }
        .btn { background: #333; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn:active { background: var(--accent); color: black; transform: scale(0.95); }
        .btn-wide { width: 48%; background: #2980b9; margin-top: 10px; }
        
        /* Joysticks */
        .joy-wrapper { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .joy-base { background: #111; border: 3px solid #333; position: relative; border-radius: 50%; }
        .joy-xy { width: 140px; height: 140px; }
        .joy-z { width: 50px; height: 140px; border-radius: 25px; }
        .joy-stick { width: 50px; height: 50px; background: #555; border: 2px solid var(--accent); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Offline Canvas Visualizer */
        .views { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        canvas { background: #000; border: 1px solid #444; border-radius: 8px; width: 180px; height: 180px; }
        .canvas-label { font-size: 12px; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>Spider-Cam Control</h2>

    <div class="panel">
        <h3 id="mode-text" style="color:#f39c12;">Phase 1: Hardware Jog & Save</h3>
        
        <div id="motors">
            <!-- Motors injected via JS -->
        </div>

        <div class="joy-wrapper">
            <div class="joy-base joy-xy" id="base-xy"><div class="joy-stick" id="stick-xy"></div></div>
            <div class="joy-base joy-z" id="base-z"><div class="joy-stick" id="stick-z"></div></div>
        </div>

        <div>
            <button class="btn btn-wide" onclick="saveCorner()">Mark Corner (<span id="c-count">0</span>/8)</button>
            <button class="btn btn-wide" style="background:#27ae60;" onclick="lockWorkspace()">Lock IK Model</button>
        </div>
    </div>

    <!-- ZERO-DEPENDENCY LIVE VISUALIZER -->
    <div class="panel">
        <h3>Live Workspace Projection</h3>
        <div class="views">
            <div>
                <div class="canvas-label">Top View (X, Y)</div>
                <canvas id="topView" width="200" height="200"></canvas>
            </div>
            <div>
                <div class="canvas-label">Side View (X, Z)</div>
                <canvas id="sideView" width="200" height="200"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. Build Individual Motor Buttons
        const motorsDiv = document.getElementById('motors');
        for(let i=0; i<4; i++) {
            motorsDiv.innerHTML += `
                <div class="motor-row">
                    <span>Motor ${i+1}</span>
                    <div>
                        <button class="btn" onclick="jog(${i}, -1)">IN</button>
                        <button class="btn" onclick="jog(${i}, 1)">OUT</button>
                    </div>
                </div>`;
        }

        function jog(motor, dir) { fetch(`/api/jog?motor=${motor}&dir=${dir}`); }

        // 2. Joystick Logic
        let vx=0, vy=0, vz=0, controlLoop=null;

        function initJoystick(baseId, stickId, isZ) {
            const base = document.getElementById(baseId);
            const stick = document.getElementById(stickId);
            let active = false;

            base.addEventListener('pointerdown', (e) => {
                active = true; base.setPointerCapture(e.pointerId);
                stick.style.transition = 'none';
                updateStick(e);
                if(!controlLoop) controlLoop = setInterval(() => {
                    fetch(`/api/joystick?vx=${vx.toFixed(2)}&vy=${vy.toFixed(2)}&vz=${vz.toFixed(2)}`);
                }, 150);
            });

            base.addEventListener('pointermove', (e) => { if(active) updateStick(e); });

            const stop = () => {
                active = false;
                stick.style.transition = 'transform 0.2s';
                stick.style.transform = `translate(-50%, -50%)`;
                if(isZ) vz = 0; else { vx = 0; vy = 0; }
                if(vx===0 && vy===0 && vz===0) { clearInterval(controlLoop); controlLoop = null; }
            };
            base.addEventListener('pointerup', stop);
            base.addEventListener('pointercancel', stop);

            function updateStick(e) {
                const r = base.getBoundingClientRect();
                let x = e.clientX - r.left - r.width/2;
                let y = e.clientY - r.top - r.height/2;
                if(isZ) x = 0;
                
                const max = (isZ ? r.height : r.width)/2 - 25;
                const d = Math.sqrt(x*x + y*y);
                if(d > max) { x = (x/d)*max; y = (y/d)*max; }
                
                stick.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                if(isZ) vz = -y/max; else { vx = x/max; vy = -y/max; }
            }
        }
        initJoystick('base-xy', 'stick-xy', false);
        initJoystick('base-z', 'stick-z', true);

        // 3. Calibration Calls
        function saveCorner() { fetch('/api/save_corner'); }
        function lockWorkspace() { fetch('/api/finish_calibration'); }

        // 4. Live Canvas Visualizer Updater
        const ctxTop = document.getElementById('topView').getContext('2d');
        const ctxSide = document.getElementById('sideView').getContext('2d');

        setInterval(() => {
            fetch('/api/state').then(r => r.json()).then(s => {
                document.getElementById('c-count').innerText = s.corners;
                
                if(s.calibrated) {
                    document.getElementById('mode-text').innerText = "Phase 2: IK 3D Control";
                    document.getElementById('mode-text').style.color = "var(--accent)";
                    document.getElementById('motors').style.display = "none";
                }

                ctxTop.clearRect(0,0,200,200); ctxSide.clearRect(0,0,200,200);

                if(!s.calibrated) {
                    // Pre-calibration: Visualize raw motor unspooling abstractly
                    ctxTop.fillStyle = '#fff';
                    ctxTop.fillText("Calibrating...", 65, 100);
                    s.steps.forEach((step, i) => {
                        ctxTop.fillRect(10 + (i*40), 180, 20, -(step/5000));
                    });
                } else {
                    // Post-calibration: Accurate Orthographic 2D Projections
                    const w = s.dim[0], l = s.dim[1], h = s.dim[2];
                    const scale = 160 / Math.max(w, l, h);

                    // Top View (X/Y Plane)
                    ctxTop.strokeStyle = '#444';
                    ctxTop.strokeRect(20, 20, w*scale, l*scale);
                    ctxTop.fillStyle = '#00ff88';
                    ctxTop.beginPath();
                    ctxTop.arc(20 + s.pos[0]*scale, 20 + (l - s.pos[1])*scale, 6, 0, Math.PI*2);
                    ctxTop.fill();

                    // Side View (X/Z Plane)
                    ctxSide.strokeStyle = '#444';
                    ctxSide.strokeRect(20, 20, w*scale, h*scale);
                    ctxSide.fillStyle = '#f39c12';
                    ctxSide.beginPath();
                    ctxSide.arc(20 + s.pos[0]*scale, 20 + (h - s.pos[2])*scale, 6, 0, Math.PI*2);
                    ctxSide.fill();
                }
            });
        }, 200); // Pulls state and updates graphics every 200ms
    </script>
</body>
</html>
